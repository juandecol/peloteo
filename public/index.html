<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Peloteo</title>
<style>
:root{
  --bg:#EDF2EC; --surface:#FFFFFF; --ink:#14251D; --muted:#5A6B61; --line:#C9D5CB;
  --court:#1E6B4F; --court-ink:#FFFFFF; --ball:#D7E845;
}
@media (prefers-color-scheme: dark){
  :root{color-scheme:dark;
    --bg:#0E1814; --surface:#16241E; --ink:#E8F0EA; --muted:#94A79C; --line:#2A3D33;
    --court:#2C8A66;}
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.45}
header{background:var(--court);color:var(--court-ink);padding:1rem}
header strong{font-size:1.25rem}
main{max-width:34rem;margin:0 auto;padding:1rem}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:1rem}
.muted{color:var(--muted)}
code{font-size:.95em}
</style>
</head>
<body>
<header><strong>Peloteo</strong></header>
<main>
  <div class="card">
    <h1>En construcción</h1>
    <p class="muted">Etapa 1: estructura, Worker y base de datos.</p>
    <p id="estado" class="muted">Revisando la base de datos…</p>
  </div>
</main>
<script>
fetch('/api/health').then(r=>r.json()).then(d=>{
  const c=d.counts||{};
  document.getElementById('estado').textContent=d.ok
    ?'Base de datos lista: '+c.venues+' lugares, '+c.sports+' deportes, '+c.courts+' canchas, '+c.games+' encuentros, '+c.players+' jugadores.'
    :'La base de datos no respondió.';
}).catch(()=>{document.getElementById('estado').textContent='La base de datos no respondió.';});
</script>
</body>
</html>
